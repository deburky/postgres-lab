# Builds the book (book/) and publishes it to GitHub Pages. The notebooks are rendered from their saved
# outputs and the scenes replay recorded traces, so the build needs no database or app.
name: Book

on:
  push:
    branches: [main]
    paths: ["book/**", "viz/**", ".github/workflows/book.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - name: Build the scenes in replay mode
        working-directory: viz
        run: npm ci && npm run build:book
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
      - name: Render
        run: quarto render book
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
