<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postgres SQL Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/sql/sql.css" />
  </head>
  <body>
    <main class="console">
      <header class="head">
        <h1 id="lab-title">Postgres in your browser</h1>
        <p id="lab-blurb"></p>
      </header>

      <div id="chips" class="chips" role="group" aria-label="Examples"></div>

      <div class="editor">
        <textarea id="sql" spellcheck="false" autocomplete="off" aria-label="SQL"></textarea>
        <div class="bar">
          <button type="button" id="run" class="primary" disabled>Run</button>
          <button type="button" id="reset" disabled>Reset data</button>
          <span class="hint">⌘/Ctrl + Enter runs</span>
          <span id="pg" class="pg"></span>
          <span id="status" class="status">Starting Postgres…</span>
        </div>
      </div>

      <section id="out" class="out" aria-live="polite"></section>
    </main>

    <script type="module" src="./src/sql/main.ts"></script>
  </body>
</html>
