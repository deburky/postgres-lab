# Postgres 18 + pgvector + pgvectorscale + pg_vectorsearch (prism), on port 5441 next to pg16.
#   docker compose -f docker/pg18.yaml up -d --build      (or: just db pg18)
#
# Postgres 18 images keep data under /var/lib/postgresql/18/docker, so the volume is mounted one
# level up, at /var/lib/postgresql, not at .../data as for pg16.
name: pg18-dev

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.pg18
    image: sqlalchemy-pgvector-db:pg18
    container_name: pg18-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwd}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${PG18_PORT:-5441}:5432"
    # PRISM builds cluster a sample in maintenance_work_mem and scale with parallel workers
    command: ["postgres", "-c", "maintenance_work_mem=1GB", "-c", "max_parallel_maintenance_workers=4"]
    shm_size: 1g
    volumes:
      - pg18data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg18data:
